name: T3 fork release

# Publishes a release of this fork for every new commit on main: gentle-ai for
# Windows, macOS, and Linux, versioned as upstream's latest release plus the
# fork commit, such as 3.7.0-t3.4816ea6. Upstream's release workflow ignores
# these tags because they carry a pre-release suffix. Each build updates itself
# from this repository's releases (internal/update/fork.go), and main gets
# upstream's changes from t3-sync.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t3-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: meta
        name: Resolve version
        run: |
          # Releases are tagged off main upstream, so the fork only has them after a fetch.
          git fetch --quiet --tags https://github.com/Gentleman-Programming/gentle-ai.git
          release=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          version="${release#v}-t3.$(git rev-parse --short=7 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$release" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.meta.outputs.exists != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - if: steps.meta.outputs.exists != 'true'
        name: Test the fork's additions
        run: go test ./internal/api/... ./internal/components/uninstall/... ./internal/update/...

      - if: steps.meta.outputs.exists != 'true'
        name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p build dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="gentle-ai_${VERSION}_${os}_${arch}"
            binary=gentle-ai
            if [ "$os" = windows ]; then binary=gentle-ai.exe; fi
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=$VERSION -X github.com/gentleman-programming/gentle-ai/v3/internal/update.forkRepository=$GITHUB_REPOSITORY" \
              -o "build/$name/$binary" ./cmd/gentle-ai
            cp LICENSE README.md "build/$name/"
            # Updates download the .tar.gz; the .zip is for installing by hand on Windows.
            tar -C build -czf "dist/$name.tar.gz" "$name"
            if [ "$os" = windows ]; then (cd build && zip -qr "../dist/$name.zip" "$name"); fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - if: steps.meta.outputs.exists != 'true'
        name: Publish
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BASE: ${{ steps.meta.outputs.base }}
        run: |
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts"
          {
            echo "gentle-ai $BASE and upstream main as of $(git log -1 --format=%cs), plus this fork's headless API that T3 Code uses."
            echo
            echo "**Install**, replacing any gentle-ai already on your \`PATH\`:"
            echo
            echo "- Windows (PowerShell): \`irm $raw/t3-install.ps1 | iex\`"
            echo "- macOS and Linux: \`curl -fsSL $raw/t3-install.sh | sh\`"
            echo
            echo "It then updates itself from this repository's releases, the way gentle-ai updates from upstream's, and never switches back to an upstream release."
          } > notes.md
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "gentle-ai $VERSION" --notes-file notes.md --latest
