name: T3 fork sync

# Merges upstream main into this fork's main every few hours, tests the fork's
# additions, and pushes, which publishes a release (t3-release.yml). Merging
# (never rebasing) keeps main pushable without a force push. A conflict or a
# failing test fails this run and leaves main as it was.
#
# Needs a SYNC_TOKEN secret: a token with the repo and workflow scopes. The
# built-in token cannot push upstream's workflow changes, and its pushes would
# not start the release.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Opens an issue when a sync fails, so a stuck fork is noticed, and closes it once one succeeds.
  issues: write

concurrency:
  group: t3-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - id: merge
        name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet https://github.com/Gentleman-Programming/gentle-ai.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit -m "chore(fork): sync upstream" FETCH_HEAD
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - if: steps.merge.outputs.merged == 'true'
        name: Test and push
        run: |
          go test ./internal/api/... ./internal/components/uninstall/... ./internal/update/...
          git push origin HEAD:main

      - if: failure()
        name: Report the failed sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="T3 fork sync is failing"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The scheduled merge of upstream main failed, so main and its releases are no longer following upstream. Usually a merge conflict or a failing check: see $run_url. This closes itself after the next successful sync."
          fi

      - if: success()
        name: Close the failed-sync issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="T3 fork sync is failing"
          for issue in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Synced again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
